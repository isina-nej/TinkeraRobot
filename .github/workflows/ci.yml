name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Default CI uses SQLite and needs NO Telegram/AI secrets. Live Telegram
    # tests are manual and are not run here; the concurrent-lock test
    # (ConcurrentConfirmationTests) auto-skips on SQLite. To cover it, add a
    # MySQL service and set DB_* env vars (see README).
    env:
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Compile all sources
        run: python -m compileall botapp config

      - name: Run test suite
        run: python manage.py test
